<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My W0rk — Behance</title>
  <style>
    :root {
      --card-width: 404px;
      --card-height: 316px;
      --card-gap: 44px;
      --duration: 42s;
      --active-scale: 1.05;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      /* 橘色漸層屬於整個網站，不是標題橫幅。 */
      background: linear-gradient(107deg,
        #ff6907 0%, #db5518 25%, #a63829 55%, #56211e 79%, #160607 100%);
      background-attachment: fixed;
    }
    .page { min-height: 100vh; padding: 0 0 42px; }
    .work-header {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: clamp(230px, 28vw, 350px);
      overflow: hidden;
      padding: 35px 0 52px;
      /* No panel, border, or independent background. */
    }
    .work-title {
      display: block;
      position: relative;
      z-index: 3;
      width: min(58.5vw, 603px);
      height: auto;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }
    .arrow {
      position: absolute;
      display: block;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }
    /* Side arrows extend 40% of their own width OUTSIDE the viewport edges. */
    .arrow--left, .arrow--right {
      top: 0;
      bottom: 0;
      height: 100%;
      width: clamp(118px, 20vw, 310px);
      z-index: 1;
    }
    .arrow--left { left: calc(-0.4 * clamp(118px, 20vw, 310px)); transform: translateY(-7%); opacity: .22; }
    .arrow--right { right: calc(-0.4 * clamp(118px, 20vw, 310px)); transform: translateY(-7%) scaleX(-1); opacity: .85; }
    .marquee {
      width: 100%;
      overflow: hidden;
      background: transparent; /* Show the site's orange background. */
      padding: 42px 0 54px;
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: scroll-right var(--duration) linear infinite;
      will-change: transform;
    }
    .marquee-group {
      display: flex;
      flex: 0 0 auto;
      gap: var(--card-gap);
      padding-right: var(--card-gap);
    }
    .project {
      position: relative;
      flex: 0 0 var(--card-width);
      width: var(--card-width);
      height: var(--card-height);
      overflow: hidden; /* Crop the cross-origin iframe's own scrollbars. */
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.10);
      transform-origin: center;
      transition: transform .28s ease, box-shadow .28s ease, filter .28s ease;
      z-index: 0;
    }
    .project iframe {
      display: block;
      /* Give the embedded page extra room, then scale the complete page to fit the card. */
      --embed-scale: .9;
      width: calc(100% / var(--embed-scale));
      height: calc(100% / var(--embed-scale));
      transform: scale(var(--embed-scale));
      transform-origin: top left;
      border: none;
      overflow: hidden;
      background: #fff;
    }
    .marquee:has(.project:hover) .marquee-track { animation-play-state: paused; }
    .marquee:has(.project:hover) .project:not(:hover) { filter: brightness(.48); }
    .project:hover {
      z-index: 2;
      transform: scale(var(--active-scale));
      box-shadow: 0 10px 20px rgba(0,0,0,.28);
    }
    @keyframes scroll-right {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }
    @media (max-width: 600px) {
      :root { --card-width: min(404px, 78vw); --card-height: min(316px, 61vw); --card-gap: 25px; }
      .work-header { min-height: 220px; padding-top: 24px; padding-bottom: 46px; }
      .work-title { width: min(64.8vw, 450px); }
      .arrow--left, .arrow--right { width: 25vw; }
      .arrow--left { left: -10vw; }
      .arrow--right { right: -10vw; }
      .marquee { padding: 36px 0 46px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .marquee-track { animation-play-state: paused; }
    }
  </style>
</head>
