@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap");
/* Split: left ToolSet art / right interactive network. Avoid overflow:hidden on
   sticky ancestors: it would create a scroll container and break sticky. */
#layout {display:grid;grid-template-columns:15% minmax(0,1fr);width:100%;height:100%;overflow:clip;background:#030303}
#toolset-panel {
  position:sticky;
  top:0;
  align-self:start;
  min-width:0;
  height:100%;
  padding:10px 0 0;
  margin:0;
  background:#e04f0b;
  overflow:hidden;
  isolation:isolate;
  z-index:2;
  pointer-events:none;
  /* Separate proportional tracks so 30%/5% are relative to THIS sidebar,
     not to the full viewport (percentage padding on grid items is deceptive). */
  display:grid;
  grid-template-columns:30% minmax(0,65%) 5%;
  grid-template-rows:minmax(0,1fr);
  align-items:start;
}
#toolset-art {
  grid-column:2;
  grid-row:1;
  position:sticky;
  top:10px;
  display:block;
  width:100%;
  height:100%;
  min-height:0;
  max-width:100%;
  object-fit:contain;
  object-position:right top;
  margin:0;
  padding:0;
  pointer-events:none;
}

:root {color-scheme:dark}
* {box-sizing:border-box}
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#030303;font-family:Archivo,Arial,Helvetica,sans-serif}
#stage {position:relative;isolation:isolate;width:100%;height:100%;overflow:hidden;background:#030303;touch-action:none;cursor:default}
#constellation {position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* Decorative SVG circles are a separate background layer; they are not parents of the icons. */
#halo-world {position:absolute;left:50%;top:50%;width:1200px;height:700px;transform-origin:center center;z-index:1;pointer-events:none;will-change:transform}
/* Layer 2: draggable network, strictly above the information layer. */
#world {position:absolute;left:50%;top:50%;width:1200px;height:700px;transform-origin:center center;z-index:4;pointer-events:none;will-change:transform}
#node-halos {position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
/* These circles belong to the responsive graph world, never to individual draggable nodes. */
.node-halo {
  position:absolute;width:655.2px;height:655.2px;
  transform:translate(-50%,-50%);
  background-image:url("data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiIHN0YW5kYWxvbmU9Im5vIj8+PCFET0NUWVBFIHN2ZyBQVUJMSUMgIi0vL1czQy8vRFREIFNWRyAxLjEvL0VOIiAiaHR0cDovL3d3dy53My5vcmcvR3JhcGhpY3MvU1ZHLzEuMS9EVEQvc3ZnMTEuZHRkIj48c3ZnIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIHZpZXdCb3g9IjAgMCA3ODggNzg4IiB2ZXJzaW9uPSIxLjEiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgeG1sbnM6eGxpbms9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkveGxpbmsiIHhtbDpzcGFjZT0icHJlc2VydmUiIHhtbG5zOmFmZmluaXR5PSJodHRwczovL3d3dy5hZmZpbml0eS5zdHVkaW8vIiBzdHlsZT0iZmlsbC1ydWxlOmV2ZW5vZGQ7Y2xpcC1ydWxlOmV2ZW5vZGQ7c3Ryb2tlLWxpbmVqb2luOnJvdW5kO3N0cm9rZS1taXRlcmxpbWl0OjI7Ij48Y2lyY2xlIGN4PSIzOTMuODI1IiBjeT0iMzkzLjgyNSIgcj0iMzkzLjgyNSIgc3R5bGU9ImZpbGw6dXJsKCNfUmFkaWFsMSk7Ii8+PGRlZnM+PHJhZGlhbEdyYWRpZW50IGlkPSJfUmFkaWFsMSIgY3g9IjAiIGN5PSIwIiByPSIxIiBncmFkaWVudFVuaXRzPSJ1c2VyU3BhY2VPblVzZSIgZ3JhZGllbnRUcmFuc2Zvcm09Im1hdHJpeCg0NjEuNzgyMjc5LC0yNTkuMDE1MzEyLDEzOC43NzczOTQsODYxLjg3NDM4NSwzODIuMzA2ODg2LDM4NC4zMjMzMDcpIj48c3RvcCBvZmZzZXQ9IjAiIHN0eWxlPSJzdG9wLWNvbG9yOiMwYTBhMGE7c3RvcC1vcGFjaXR5OjAiLz48c3RvcCBvZmZzZXQ9IjEiIHN0eWxlPSJzdG9wLWNvbG9yOiM4OTJjMDA7c3RvcC1vcGFjaXR5OjEiLz48L3JhZGlhbEdyYWRpZW50PjwvZGVmcz48L3N2Zz4=");

}
/* Decorative circles scale with the world, not with individual dragged nodes. Enlarged 40% and shifted up by 30% of the previous circle diameter. */
.node-halo[data-halo="left"] {left:508px;top:444px;width:655.2px;height:655.2px}
.node-halo[data-halo="right"] {left:1013px;top:424px;width:670px;height:670px}
/* Independent group transform: move software nodes AND lines, leave SVG halos untouched. */
#graph-assembly {position:absolute;inset:0;z-index:2;pointer-events:none;transform-origin:600px 350px;will-change:transform}
#edges {position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.edge-glow {stroke:#ffa55d;stroke-width:8;opacity:.18;filter:blur(6px);stroke-linecap:round;transition:opacity .2s}
.edge-base {stroke:#fff0d7;stroke-width:2.6;opacity:.76;stroke-linecap:round;filter:drop-shadow(0 0 5px #ffac5d);transition:stroke .2s,opacity .2s,stroke-width .2s}
.edge-flow {stroke:#fff;stroke-width:2.1;stroke-dasharray:2 26;stroke-linecap:round;opacity:.55;animation:flow 3s linear infinite}
.edge-group.dim .edge-glow,.edge-group.dim .edge-base,.edge-group.dim .edge-flow {opacity:.06}
.edge-group.focus .edge-glow {opacity:.7;stroke-width:11}
.edge-group.focus .edge-base {stroke:#fff;stroke-width:3.8;opacity:1}
.edge-group.focus .edge-flow {opacity:1;stroke-width:3.2;animation-duration:1.1s}
@keyframes flow {to {stroke-dashoffset:-112}}
#nodes {position:absolute;inset:0;z-index:3;pointer-events:none}
.node {position:absolute;width:116px;height:124px;translate:-50% -50%;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none;will-change:left,top}
.node.is-dragging {cursor:grabbing;z-index:20}
.node-image {position:absolute;left:50%;top:43%;width:var(--icon-size,273px);height:var(--icon-size,273px);object-fit:contain;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 5px 12px #060304);transition:transform .25s cubic-bezier(.2,1.7,.3,1),filter .25s,opacity .2s}
.node[data-node="blender"],.node[data-node="cavalry"] {--icon-size:292.5px}
.node[data-node="maxon"],.node[data-node="affinity"] {--icon-size:351px}
.node[data-node="processing"] {--icon-size:390px}
.node:hover,.node.hovered {z-index:8}
.node:hover .node-image,.node.hovered .node-image {transform:translate(-50%,-50%) scale(1.23);filter:drop-shadow(0 0 19px rgba(255,151,85,.75))}
.node.is-dragging .node-image {transform:translate(-50%,-50%) scale(1.12);transition:none;filter:drop-shadow(0 0 23px #ffa15c)}
.node.dim .node-image {opacity:.23;filter:grayscale(.4) brightness(.5)}
.node.dim .node-label {opacity:.26}
.node-label {pointer-events:none;white-space:nowrap;position:absolute;left:50%;top:91px;transform:translateX(-50%);padding:5px 8px;border-radius:3px;background:rgba(11,11,12,.82);font-size:25.5px;font-weight:450;letter-spacing:-.35px;line-height:1.15;color:#fcf7f1;text-shadow:0 1px 3px #000;transition:top .25s,background .25s,opacity .2s}
.node:hover .node-label,.node.hovered .node-label {top:94px;background:rgba(25,16,13,.93)}
.node[data-node="processing"] .node-label {top:112px}
.node[data-node="processing"]:hover .node-label,.node[data-node="processing"].hovered .node-label {top:115px}
.node[data-node="maxon"] .node-label {top:-38px}
.node[data-node="maxon"]:hover .node-label,.node[data-node="maxon"].hovered .node-label {top:-50px}
@media (prefers-reduced-motion:reduce) {.edge-flow {animation:none!important}.node-image,.node-label {transition:none}}


/* 世界座標；背景不與任何節點綁定 */
.node-halo[data-halo="left"] {left:508px;top:444px;width:655.2px;height:655.2px}
.node-halo[data-halo="right"] {left:1013px;top:424px;width:670px;height:670px}
/* 節點群相對預覽區位移與縮放 (在 JS 初始化時生效) */
/* x:2%, y:0%, scale:100% */
/* Two layers: information (SVG and readout stacked) + interactive network. */
#information-layer {
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:flex-start;
  pointer-events:none;overflow:hidden;isolation:isolate;
}
/* The title occupies 80% of the NETWORK panel, retaining its 5% left inset. */
#use-art {
  position:relative;z-index:2;left:auto;top:auto;
  box-sizing:border-box;width:80%;height:auto;
  flex:none;margin-top:7px;padding-left:5%;
  display:block;pointer-events:none;object-fit:contain;object-position:left top;
}
/* Same first layer, directly under the SVG, right aligned. */
#proficiency-readout {
  position:relative;z-index:3;right:auto;bottom:auto;
  margin:clamp(4px,1.5vh,14px) clamp(12px,3%,42px) 0 auto;
  display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
  text-align:right;pointer-events:none;user-select:none;
  font-family:Archivo,Arial,Helvetica,sans-serif;white-space:nowrap;
}
#proficiency-readout .proficiency-value {
  display:flex;align-items:baseline;justify-content:flex-end;
  color:#e04f0b;
  font-size:clamp(80px,13.6vw,184px); /* 200% of previous value's size */
  font-weight:360;letter-spacing:-.065em;line-height:.84;
  font-variant-numeric:tabular-nums lining-nums;
  transform-origin:right bottom;will-change:transform,opacity,filter;
  text-shadow:0 0 1px rgba(224,79,11,.15);
}
#proficiency-readout .number {display:inline-block;min-width:2.17ch}
#proficiency-readout .pct {display:inline-block;letter-spacing:-.07em}
#proficiency-readout .proficiency-caption {
  margin-top:clamp(8px,1vw,16px);padding:0;color:#f5f2ee;
  font-size:clamp(12px,2.1vw,26px);font-weight:370;
  line-height:1.2;letter-spacing:-.035em;
}
#proficiency-readout .proficiency-value.flash {
  text-shadow:-1px 0 rgba(255,143,68,.6),1px 0 rgba(112,30,0,.45)
}
@media (max-height:350px) {
  #proficiency-readout .proficiency-value {font-size:clamp(66px,14vw,120px)}
  #proficiency-readout .proficiency-caption {font-size:clamp(11px,2.3vw,18px);margin-top:5px}
}
@media (prefers-reduced-motion:reduce) {
  #proficiency-readout .proficiency-value {transform:none!important;filter:none!important;opacity:1!important}
}


/* Real layout: information section / adjustable gap / parent node section. */
#stage {
  --info-height: 46%;
  --svg-value-gap: 14px;
  --sections-gap: 24px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  overflow:hidden;
}
#information-layer {
  position:relative;
  inset:auto;
  flex:0 0 var(--info-height);
  width:100%;
  min-height:0;
  overflow:hidden;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  pointer-events:none;
}
#use-art {
  position:relative;
  left:auto;
  top:auto;
  flex:0 1 auto;
  width:80%;
  height:auto;
  max-height:38%;
  box-sizing:border-box;
  object-position:left top;
  object-fit:contain;
  padding-left:5%;
  margin:7px 0 0;
}
#proficiency-readout {
  position:relative;
  margin:var(--svg-value-gap) clamp(12px,3%,42px) 0 auto;
  flex:0 0 auto;
  align-self:flex-end;
  padding:0;
}
#proficiency-readout .proficiency-value {
  font-size:clamp(40px,min(11vw,18vh),160px);
}
#proficiency-readout .proficiency-caption {
  font-size:clamp(11px,min(1.8vw,3.2vh),24px);
  margin-top:clamp(4px,1vh,10px);
}
#section-gap {flex:0 0 var(--sections-gap);height:var(--sections-gap);pointer-events:none;position:relative;z-index:2;}
#node-container {
  position:relative;
  isolation:isolate;
  flex:1 1 auto;
  min-height:0;
  width:100%;
  overflow:hidden;
  pointer-events:auto;
  touch-action:none;
  z-index:3;
}
#node-container #constellation {position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
#node-container #halo-world {z-index:1}
#node-container #world {z-index:4}
@media (max-height:360px) {
  #information-layer {--info-height:45%}
  #proficiency-readout .proficiency-value {font-size:clamp(35px,min(11vw,17vh),105px)}
  #proficiency-readout .proficiency-caption {font-size:clamp(9px,2vw,14px)}
}

/* Dedicated iframe view preserves the network's native desktop composition. */
html,body { width:100%; height:100%; margin:0; overflow:hidden; }

let groupDX=0,groupDY=0;
function applyGraphGroupTransform(){
  const width=stage.clientWidth || 1,height=stage.clientHeight || 1;

const svg=document.getElementById('edges');
const layer=document.getElementById('nodes');
const graph=new Map(initial.map(([id,name,x,y])=>[id,{id,name,x,y,ox:x,oy:y,el:null,vx:0,vy:0,returning:false}]));
const neighbors=id=>new Set(connections.flatMap(([a,b])=>a===id?[b]:b===id?[a]:[]));
const namespace='http://www.w3.org/2000/svg';
const visualIconBounds={"affinity":[240,220,82,68,157,138],"audacity":[240,237,68,68,172,169],"maxon":[240,231,82,77,159,155],"blender":[240,225,76,75,171,150],"cavalry":[240,236,74,75,166,164],"davinci":[240,238,70,70,170,168],"penpot":[240,231,72,68,169,162],"processing":[160,140,57,36,108,90],"rive":[240,237,69,69,172,169],"unity":[240,239,69,72,164,165],"vscode":[240,237,69,67,175,162]};
const edgeEls=[];
for(const [a,b] of connections){
  const group=document.createElementNS(namespace,'g');group.classList.add('edge-group');
  const lines=[];
  for(const cls of ['edge-glow','edge-base','edge-flow']){
    const line=document.createElementNS(namespace,'line');line.classList.add(cls);group.appendChild(line);lines.push(line);
  }
  svg.appendChild(group);edgeEls.push({a,b,group,lines});
}
for(const node of graph.values()){
  const el=document.createElement('div');el.className='node';el.dataset.node=node.id;
  el.innerHTML='<img class="node-image" alt="" draggable="false"><span class="node-label"></span>';
  el.querySelector('img').src=icons[node.id];
  el.querySelector('.node-label').textContent=node.name;
  el.setAttribute('aria-label',node.name);
  node.el=el;layer.appendChild(el);
}
function drawGraph(){
  // Dragging updates only nodes and edges. Decorative circles stay in world coordinates.
  for(const n of graph.values()) {n.el.style.left=n.x+'px';n.el.style.top=n.y+'px'}
  for(const e of edgeEls){
    const a=graph.get(e.a),b=graph.get(e.b);
    for(const line of e.lines){line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y)}
  }
}
let graphScale=1, graphOffsetX=0, graphOffsetY=0;
function nodeVisibleExtents(node,hover=false){
  // Align by visible icon artwork rather than transparent bitmap/glow padding.
  // This prevents hidden alpha from turning the intended 30px into a wide gap.
  const [imgW,imgH,x1,y1,x2,y2]=visualIconBounds[node.id];
  const icon=parseFloat(getComputedStyle(node.el).getPropertyValue('--icon-size'))||273;
  const imgScale=icon/Math.max(imgW,imgH)*(hover?1.23:1);
  const cy=124*.43-62;
  const label=node.el.querySelector('.node-label');
  const labelTop=node.id==='maxon'?(hover?-50:-38):(node.id==='processing'?(hover?115:112):(hover?94:91));
  const labelBottom=labelTop+label.offsetHeight;
  // normalized to node center, including the large hover image and labels
  return {
    left:Math.min((x1-imgW/2)*imgScale,-label.offsetWidth/2)-5,
    right:Math.max((x2-imgW/2)*imgScale,label.offsetWidth/2)+5,
    top:Math.min(cy+(y1-imgH/2)*imgScale,labelTop-62)-5,
    bottom:Math.max(cy+(y2-imgH/2)*imgScale,labelBottom-62)+5
  };
}
function sceneBounds(){
  let left=Infinity,right=-Infinity,top=Infinity,bottom=-Infinity;
  for(const n of graph.values()){
    const b=nodeVisibleExtents(n);
    left=Math.min(left,n.ox+b.left);right=Math.max(right,n.ox+b.right);
    top=Math.min(top,n.oy+b.top);bottom=Math.max(bottom,n.oy+b.bottom);
  }
  return {left,right,top,bottom};
}
function fitGraph(){
  const {width,height}=stage.getBoundingClientRect();
  // The network occupies the right 85% viewport; anchor visible content 30px from its right edge.
  const box=sceneBounds(),padding=30;
  graphScale=Math.min((width-2*padding)/(box.right-box.left),(height-2*padding)/(box.bottom-box.top),1.28);
  graphScale=Math.max(.01,graphScale);
  graphOffsetX=width-padding-(box.right-600)*graphScale;
  graphOffsetY=height/2+(350-(box.top+box.bottom)/2)*graphScale+Math.min(18,height*.06);
  world.style.left=graphOffsetX+'px';
  world.style.top=graphOffsetY+'px';
  world.style.transform=`translate(-50%,-50%) scale(${graphScale})`;
  // Sync only overall responsive transform; dragging does not move halos.
  haloWorld.style.left=world.style.left;
  haloWorld.style.top=world.style.top;
  haloWorld.style.transform=world.style.transform;
  applyGraphGroupTransform();
  for(const n of graph.values()) if(n.returning) keepInside(n);
  drawGraph();
}
const clamp=(value,min,max)=>min>max?(min+max)/2:Math.max(min,Math.min(max,value));
function keepInside(node){
  const bounds=stage.getBoundingClientRect();
  const box=nodeVisibleExtents(node,true),padding=30;
  const visualScale=graphScale*groupShift.scale;
  const centerX=graphOffsetX+((node.x-600)*groupShift.scale+groupDX)*graphScale;
  const centerY=graphOffsetY+((node.y-350)*groupShift.scale+groupDY)*graphScale;
  const minX=padding-box.left*visualScale;
  const maxX=bounds.width-padding-box.right*visualScale;
  const minY=padding-box.top*visualScale;
  const maxY=bounds.height-padding-box.bottom*visualScale;
  const nx=clamp(centerX,minX,maxX),ny=clamp(centerY,minY,maxY);
  const hitX=Math.abs(nx-centerX)>.001,hitY=Math.abs(ny-centerY)>.001;
  node.x+=(nx-centerX)/visualScale;node.y+=(ny-centerY)/visualScale;
  return {x:hitX,y:hitY};
}
let hovered=null;
function focusNode(id){
  if(id===hovered)return;
  hovered=id;
  stage.style.cursor=dragging?'grabbing':id?'grab':'default';
  const near=id?neighbors(id):null;
  for(const n of graph.values()){
    n.el.classList.toggle('hovered',id===n.id);
    n.el.classList.toggle('dim',!!id&&n.id!==id&&!near.has(n.id));
  }
  for(const e of edgeEls){
    const focus=!!id&&(e.a===id||e.b===id);
    e.group.classList.toggle('focus',focus);
    e.group.classList.toggle('dim',!!id&&!focus);
  }
}
function hitNode(event){
  const rect=stage.getBoundingClientRect();
  const x=((event.clientX-rect.left-graphOffsetX)/graphScale-groupDX)/groupShift.scale+600;
  const y=((event.clientY-rect.top-graphOffsetY)/graphScale-groupDY)/groupShift.scale+350;
  let best=null, bestScore=Infinity;
  for(const n of graph.values()){
    // Small hit areas around actual app symbols, not the large transparent PNG boxes.
    // Nearest normalized distance wins if hit circles partially overlap.
    const size=parseFloat(getComputedStyle(n.el).getPropertyValue('--icon-size'))||273;
    const r=size*(n.id==='processing'?.23:.235);
    const dy=y-(n.y+124*.43-62);
    const dx=x-n.x;
    const score=(dx*dx+dy*dy)/(r*r);
    if(score<1 && score<bestScore){best=n.id;bestScore=score;}
  }
  return best;
}
// Only hovering and holding/dragging alter the software nodes.
// Clicking does not select a node, open a panel, or keep it active.
let dragging=null;
const MAX_STRETCH=215;
function release(node){
  if(!node)return;
  node.el.classList.remove('is-dragging');
  stage.style.cursor='default';
  node.returning=true;
  node.vx=0;node.vy=0;
}
stage.addEventListener('pointerdown',event=>{
  if(event.button!==0)return;
  const id=hitNode(event);if(!id)return;
  const node=graph.get(id);
  node.returning=false;node.vx=node.vy=0;
  dragging={node,id,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,detached:false};
  node.el.classList.add('is-dragging');
  stage.style.cursor='grabbing';
  stage.setPointerCapture(event.pointerId);
  focusNode(id);
  event.preventDefault();
});
stage.addEventListener('pointermove',event=>{
  updatePointer(event);
  if(dragging){
    if(dragging.detached)return;
    const {node,startX,startY}=dragging;
    const dx=(event.clientX-startX)/(graphScale*groupShift.scale);
    const dy=(event.clientY-startY)/(graphScale*groupShift.scale);
    node.x=node.ox+dx;
    node.y=node.oy+dy;
    keepInside(node);
    const stretch=Math.max(Math.hypot(node.x-node.ox,node.y-node.oy),Math.hypot(dx,dy));
    if(stretch>=MAX_STRETCH){
      dragging.detached=true;
      release(node); // Pull too far: release even before pointerup.
      focusNode(null);
      stage.style.cursor='default';
    }
    drawGraph();
  } else focusNode(hitNode(event));
},{passive:true});
function endDrag(event){
  if(dragging && dragging.pointerId===event.pointerId){
    if(!dragging.detached)release(dragging.node);
    dragging=null;
    if(stage.hasPointerCapture(event.pointerId))stage.releasePointerCapture(event.pointerId);
    focusNode(hitNode(event));
    stage.style.cursor=hovered?'grab':'default';
  }
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('pointerleave',()=>{if(!dragging){focusNode(null);cursor.active=false}});
window.addEventListener('blur',()=>{
  if(dragging){release(dragging.node);dragging=null}
  cursor.active=false;focusNode(null);
});

// Background constellation: continuously disperses from (0, 0) in the upper-left.
const canvas=document.getElementById('constellation');
const ctx=canvas.getContext('2d',{alpha:false});
let w=1,h=1,ratio=1,dpr=1,particles=[],spawnTime=0,lastTime=0;
let origin={x:0,y:0};
const cursor={x:0,y:0,active:false};
const rnd=(a,b)=>a+Math.random()*(b-a);
const wanted=()=>clamp(Math.round(w*h/11100),w<550?20:32,85);
function particle(age=0){
  const angle=rnd(.002,Math.PI*.5-.002); // full outward quadrant from (0,0)
  const speed=rnd(39,91)*ratio;
  const dx=Math.cos(angle),dy=Math.sin(angle);
  const life=rnd(22,42);
  const p={x:origin.x,y:origin.y,
   vx:dx*speed,vy:dy*speed,dx,dy,speed,life,age,phase:rnd(0,6.283),
   wobble:rnd(.05,.20),r:rnd(4.7,10.5)*ratio*.5,bright:rnd(.62,1.05)};
  if(age>0){p.x+=dx*speed*age;p.y+=dy*speed*age}
  return p;
}
function seedParticles(){
  particles=[];
  const count=wanted();
  let attempts=0;
  while(particles.length<count*.95&&attempts++<1000){
    const p=particle();
    p.age=rnd(.4,Math.min(32,Math.hypot(w,h)/p.speed*1.1,p.life*.85));
    p.x+=p.dx*p.speed*p.age;
    p.y+=p.dy*p.speed*p.age;
    if(p.x<w+15*ratio&&p.y<h+15*ratio)particles.push(p);
  }
  spawnTime=0;
}
function resize(){
  const bounds=stage.getBoundingClientRect();
  const oldW=w,oldH=h;
  w=Math.max(1,bounds.width);h=Math.max(1,bounds.height);
  ratio=clamp(Math.min(w/1050,h/600),.49,1.6);
  origin={x:0,y:0};
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(particles.length && oldW>1&&oldH>1){for(const p of particles){p.x*=w/oldW;p.y*=h/oldH}}
  else seedParticles();
  fitGraph();
}
function updatePointer(event){
  const rect=stage.getBoundingClientRect();
  cursor.x=event.clientX-rect.left;
  cursor.y=event.clientY-rect.top;
  cursor.active=true;
}
stage.addEventListener('pointerenter',updatePointer,{passive:true});
stage.addEventListener('pointerdown',updatePointer,{passive:true});
function opacity(p){
  const start=clamp(p.age/1.9,0,1),end=clamp((p.life-p.age)/4.6,0,1);
  const margin=30*ratio;
  const edge=clamp(Math.min(p.x+margin,w+margin-p.x,p.y+margin,h+margin-p.y)/(55*ratio),0,1);
  return start*end*edge;
}
function stepParticles(dt){
  spawnTime+=dt;
  const max=wanted(),interval=Math.max(.12,17/max);
  while(spawnTime>=interval){spawnTime-=interval;if(particles.length<max)particles.push(particle())}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.age+=dt;
    if(p.age>=p.life||p.x<-90*ratio||p.x>w+90*ratio||p.y<-90*ratio||p.y>h+90*ratio){particles.splice(i,1);continue}
    const breezeX=Math.sin(p.age*.37+p.phase)*ratio*p.wobble;
    const breezeY=Math.cos(p.age*.29+p.phase)*ratio*p.wobble;
    const homeVX=p.dx*p.speed+breezeX,homeVY=p.dy*p.speed+breezeY;
    const relax=1-Math.exp(-dt*1.55);
    p.vx+=(homeVX-p.vx)*relax;p.vy+=(homeVY-p.vy)*relax;
    if(cursor.active){
      const dx=cursor.x-p.x,dy=cursor.y-p.y,dist=Math.hypot(dx,dy);
      const radius=215*ratio;
      if(dist>2&&dist<radius){
        const proximity=1-dist/radius;
        const force=650*ratio*Math.pow(proximity,1.55);
        p.vx+=dx/dist*force*dt;p.vy+=dy/dist*force*dt;
        const damping=Math.exp(-dt*(.38+proximity*1.4));p.vx*=damping;p.vy*=damping;
      }
    }
    const v=Math.hypot(p.vx,p.vy),limit=235*ratio;
    if(v>limit){p.vx*=limit/v;p.vy*=limit/v}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
}
function drawParticles(){
  ctx.fillStyle='#030303';ctx.fillRect(0,0,w,h);
  const radius=172*ratio,r2=radius*radius;
  for(let i=0;i<particles.length;i++){
    const a=particles[i],alpha=opacity(a);
    if(alpha<.004)continue;
    const near=[];
    for(let j=i+1;j<particles.length;j++){
      const b=particles[j],dx=b.x-a.x,dy=b.y-a.y,dist2=dx*dx+dy*dy;
      if(dist2<r2)near.push({b,dist2});
    }
    near.sort((x,y)=>x.dist2-y.dist2);
    for(const {b,dist2} of near.slice(0,3)){
      const a2=alpha*opacity(b)*(.12+.37*(1-Math.sqrt(dist2)/radius));
      if(a2<.008)continue;
      const hot=cursor.active&&(Math.hypot(a.x-cursor.x,a.y-cursor.y)<215*ratio||Math.hypot(b.x-cursor.x,b.y-cursor.y)<215*ratio);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.lineWidth=(hot?1.55:1.15)*ratio;
      ctx.strokeStyle=`rgba(${hot?'184,118,39':'126,83,24'},${Math.min(.65,a2*(hot?1.8:1.1))})`;
      ctx.stroke();
    }
  }
  for(const p of particles){
    const alpha=opacity(p);if(alpha<.008)continue;
    const near=cursor.active?clamp(1-Math.hypot(p.x-cursor.x,p.y-cursor.y)/(215*ratio),0,1):0;
    // Radial perspective: every dot shrinks progressively with distance from (0, 0).
    const distance=Math.hypot(p.x-origin.x,p.y-origin.y);
    const radial=clamp(distance/Math.hypot(w,h),0,1);
    const sizeFalloff=clamp(1-.78*Math.sqrt(radial),.22,1);
    const r=p.r*sizeFalloff*(1+near*.19);
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${Math.round(110+near*110)},${Math.round(74+near*71)},${Math.round(21+near*22)},${clamp(alpha*(.28+near*.56)*p.bright,0,.95)})`;
    ctx.fill();
  }
}
function stepSprings(dt){
  let changed=false;
  for(const n of graph.values()){
    if(!n.returning)continue;
    const dx=n.x-n.ox,dy=n.y-n.oy,stretch=Math.hypot(dx,dy);
    const stiffness=430+Math.min(860,stretch*3.5);
    const damping=20+Math.min(11,stretch*.026);
    n.vx+=(-stiffness*dx-damping*n.vx)*dt;
    n.vy+=(-stiffness*dy-damping*n.vy)*dt;
    n.x+=n.vx*dt;n.y+=n.vy*dt;
    const hit=keepInside(n);
    if(hit.x)n.vx=0;if(hit.y)n.vy=0;
    if(Math.hypot(n.x-n.ox,n.y-n.oy)<.28&&Math.hypot(n.vx,n.vy)<3.5){
      n.x=n.ox;n.y=n.oy;n.returning=false;n.vx=0;n.vy=0;
    }
    changed=true;
  }
  if(changed)drawGraph();
}
function animate(now){
  const dt=lastTime?Math.min(.025,(now-lastTime)/1000):1/60;
  lastTime=now;
  stepParticles(dt);stepSprings(dt);drawParticles();
  requestAnimationFrame(animate);
}
new ResizeObserver(resize).observe(stage);
resize();drawGraph();requestAnimationFrame(animate);
})();
</script>
<script>
(()=>{
  const display=document.getElementById('proficiency-readout');
  const valueEl=document.getElementById('proficiency-value');
  const digits=valueEl.querySelector('.number');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let index=0;
  // Intermittent samples, visually like an unstable signal rather than a regular count.
  const samples=[
    {value:'85',lo:880,hi:2100},
    {value:'86',lo:65,hi:190},
    {value:'84',lo:55,hi:160},
    {value:'85',lo:500,hi:1650},
  ];
  function tick(){
    const sample=samples[index];
    digits.textContent=sample.value;
    display.setAttribute('aria-label',sample.value+' percent, Average Proficiency');
    valueEl.classList.toggle('flash',index===1||index===2);
    index=(index+1)%samples.length;
    const delay=sample.lo+Math.random()*(sample.hi-sample.lo);
    window.setTimeout(tick,delay);
  }
  function noise(){
    const isSpike=Math.random()<.14;
    const dx=(Math.random()-.5)*(isSpike?3.8:1.2);
    const dy=(Math.random()-.5)*(isSpike?2.4:.7);
    const skew=(Math.random()-.5)*(isSpike?1.9:.3);
    valueEl.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) skewX(${skew.toFixed(2)}deg)`;
    valueEl.style.opacity=String(isSpike?.8+Math.random()*.19:.965+Math.random()*.035);
    valueEl.style.filter=isSpike&&Math.random()<.25?'blur(.5px)':'none';
    window.setTimeout(noise,50+Math.random()*170);
  }
  tick();noise();
})();
</script>
