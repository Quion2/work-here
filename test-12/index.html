<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e95909">
  <title>Quion — Two Sections Test</title>
  <style>

    :root {
      --paper: #efeeeb;
      --orange: #e95909;
      --black: #0e0e0e;
      --burnt: #de4f0b;
      --ink: #202020;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--paper); }
    body { min-height: 100vh; min-height: 100dvh; }

    .portfolio {
      width: min(100%, 1680px);
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 11.1% 46.5% 10.6% 31.8%;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .skill-side,
    .details-panel {
      background: var(--paper);
    }
    .skills-panel {
      background: var(--orange);
    }
    .timeline-ribbon {
      background: var(--black);
    }

    .desktop-shell {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      align-items: stretch;
    }

    .skill-side-inner,
    .timeline-ribbon-inner,
    .skills-panel-inner,
    .details-panel-inner {
      height: min(540px, 38.5vw);
      min-height: 354px;
    }

    .skill-side-inner,
    .timeline-ribbon-inner {
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 14px 10px;
    }

    .skill-title-img,
    .timeline-title-img {
      display: block;
      height: 100%;
      width: auto;
      max-width: 88%;
      object-fit: contain;
      object-position: center center;
    }
    .skill-title-img { object-position: center top; }

    .skills-panel-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px clamp(16px, 2.2vw, 34px);
    }

    .skills-content-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    .details-panel-inner {
      display: flex;
      flex-direction: column;
      padding: 22px clamp(18px, 2.4vw, 34px) 24px;
      gap: 18px;
    }

    .timeline-content-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .timeline-content-img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      object-position: top left;
    }

    .contact {
      flex: 0 0 auto;
      position: relative;
      text-decoration: none;
      min-height: 96px;
      border: 2px dashed rgba(40,40,40,.45);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px 14px;
      background: transparent;
      color: #141414;
      cursor: pointer;
      transform: scale(1);
      transform-origin: center;
      transition: transform .26s ease-in, border-color .26s ease-in, background-color .26s ease-in, box-shadow .26s ease-in;
    }
    .contact svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
    }
    .contact span {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(15px, 1.2vw, 18px);
      text-align: center;
      line-height: 1.2;
    }
    .contact:hover,
    .contact:focus-visible {
      transform: scale(1.1);
      border-color: #b83d08;
      background: rgba(255,115,43,.16);
      box-shadow: 0 12px 24px rgba(56,21,7,.16);
    }
    .contact:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }
    .contact:active { transform: scale(1.04); }

    /* Tablet: still keep 4 columns, but scale height down slightly */
    @media (max-width: 980px) {
      .skill-side-inner,
      .timeline-ribbon-inner,
      .skills-panel-inner,
      .details-panel-inner {
        height: min(470px, 39vw);
        min-height: 320px;
      }
      .details-panel-inner { padding: 18px 18px 20px; gap: 14px; }
      .contact { min-height: 88px; }
      .contact span { font-size: 14px; }
    }

    /* Stack only on narrow/mobile widths */
    @media (max-width: 700px) {
      .portfolio {
        display: flex;
        flex-direction: column;
      }
      .skill-side-inner,
      .timeline-ribbon-inner {
        height: 118px;
        min-height: 118px;
        padding: 10px 16px;
        justify-content: flex-start;
      }
      .skill-title-img,
      .timeline-title-img {
        max-width: none;
        width: auto;
        height: 100%;
      }
      .skills-panel-inner {
        height: auto;
        min-height: 0;
        padding: 18px 16px 20px;
      }
      .skills-content-img {
        height: auto;
        width: 100%;
      }
      .details-panel-inner {
        height: auto;
        min-height: 0;
        padding: 18px 16px 36px;
        gap: 14px;
      }
      .timeline-content-wrap { flex: 0 0 auto; }
      .timeline-content-img { width: 100%; }
      .contact { min-height: 96px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact { transition: none; }
    }


    :root {
      --card-width: 404px;
      --card-height: 316px;
      --card-gap: 44px;
      --duration: 42s;
      --active-scale: 1.05;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      /* 橘色漸層屬於整個網站，不是標題橫幅。 */
      background: linear-gradient(107deg,
        #ff6907 0%, #db5518 25%, #a63829 55%, #56211e 79%, #160607 100%);
      background-attachment: fixed;
    }
    .page { min-height: 100vh; padding: 0 0 42px; }
    .work-header {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: clamp(230px, 28vw, 350px);
      overflow: hidden;
      padding: 35px 0 52px;
      /* No panel, border, or independent background. */
    }
    .work-title {
      display: block;
      position: relative;
      z-index: 3;
      width: min(58.5vw, 603px);
      height: auto;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }
    .arrow {
      position: absolute;
      display: block;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }
    /* Side arrows extend 40% of their own width OUTSIDE the viewport edges. */
    .arrow--left, .arrow--right {
      top: 0;
      bottom: 0;
      height: 100%;
      width: clamp(118px, 20vw, 310px);
      z-index: 1;
    }
    .arrow--left { left: calc(-0.4 * clamp(118px, 20vw, 310px)); transform: translateY(-7%); opacity: .22; }
    .arrow--right { right: calc(-0.4 * clamp(118px, 20vw, 310px)); transform: translateY(-7%) scaleX(-1); opacity: .85; }
    .marquee {
      width: 100%;
      overflow: hidden;
      background: transparent; /* Show the site's orange background. */
      padding: 42px 0 54px;
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: scroll-right var(--duration) linear infinite;
      will-change: transform;
    }
    .marquee-group {
      display: flex;
      flex: 0 0 auto;
      gap: var(--card-gap);
      padding-right: var(--card-gap);
    }
    .project {
      position: relative;
      flex: 0 0 var(--card-width);
      width: var(--card-width);
      height: var(--card-height);
      overflow: hidden; /* Crop the cross-origin iframe's own scrollbars. */
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.10);
      transform-origin: center;
      transition: transform .28s ease, box-shadow .28s ease, filter .28s ease;
      z-index: 0;
    }
    .project iframe {
      display: block;
      /* Give the embedded page extra room, then scale the complete page to fit the card. */
      --embed-scale: .9;
      width: calc(100% / var(--embed-scale));
      height: calc(100% / var(--embed-scale));
      transform: scale(var(--embed-scale));
      transform-origin: top left;
      border: none;
      overflow: hidden;
      background: #fff;
    }
    .marquee:has(.project:hover) .marquee-track { animation-play-state: paused; }
    .marquee:has(.project:hover) .project:not(:hover) { filter: brightness(.48); }
    .project:hover {
      z-index: 2;
      transform: scale(var(--active-scale));
      box-shadow: 0 10px 20px rgba(0,0,0,.28);
    }
    @keyframes scroll-right {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }
    /* Fluid mobile layout: scale every major dimension using actual iframe viewport width / 760. */
    @media (max-width: 700px) {
      :root {
        --card-width: calc(404px * var(--device-scale, .513));
        --card-height: calc(316px * var(--device-scale, .513));
        --card-gap: calc(44px * var(--device-scale, .513));
      }
      html, body { width: 100%; overflow-x: hidden; }
      body { background-attachment: scroll; }
      .page {
        min-height: 100dvh;
        padding-bottom: calc(42px * var(--device-scale, .513));
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .work-header {
        min-height: 0;
        height: calc(230px * var(--device-scale, .513));
        padding: 0;
        flex-shrink: 0;
      }
      .work-title { width: calc(445px * var(--device-scale, .513)); }
      .arrow--left, .arrow--right { width: calc(152px * var(--device-scale, .513)); }
      .arrow--left { left: calc(-60.8px * var(--device-scale, .513)); }
      .arrow--right { right: calc(-60.8px * var(--device-scale, .513)); }
      .marquee {
        flex-shrink: 0;
        padding: calc(42px * var(--device-scale, .513)) 0 calc(54px * var(--device-scale, .513));
      }
      .project { box-shadow: 0 5px 16px rgba(0,0,0,.16); }
    }
    @media (hover: none) {
      .marquee:has(.project:hover) .marquee-track { animation-play-state: running; }
      .marquee:has(.project:hover) .project:not(:hover) { filter: none; }
      .project:hover { transform: none; box-shadow: 0 5px 16px rgba(0,0,0,.16); }
    }
    @media (prefers-reduced-motion: reduce) {
      .marquee-track { animation-play-state: paused; }
    }


    /* Three vertical layers. Second layer is reserved for a future design. */
    html, body { margin: 0; padding: 0; width: 100%; background: #efeeeb; overflow-x: clip; }
    .site { width: 100%; }
    .site-layer { position: relative; width: 100%; }
    .site-layer--one { background: var(--paper); min-height: 100svh; display: grid; grid-template-columns: minmax(0,1fr); align-content: center; overflow: clip; }
    .first-frame { width: 100%; min-width: 0; position: relative; overflow: clip; }
    .site-layer--one .portfolio {
      width: 1440px;
      height: 820px;
      min-height: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 11.1% 46.5% 10.6% 31.8%;
      align-items: stretch;
      transform-origin: top left;
    }
    .site-layer--two {
      background: #030303;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: clip;
    }
    .network-frame {
      position: relative;
      width: 100%;
      min-width: 0;
      overflow: clip;
    }
    .network-iframe {
      position: absolute;
      left: 0;
      top: 0;
      width: 1440px;
      height: 820px;
      border: 0;
      display: block;
      background: #030303;
      transform-origin: left top;
    }
    .site-layer--three {
      background: linear-gradient(107deg, #ff6907 0%, #db5518 25%, #a63829 55%, #56211e 79%, #160607 100%);
      overflow: clip;
    }
    .site-layer--three .page { min-height: 100svh; }
    /* Preserve the uploaded four-column design at every size; fluid scaling handles mobile. */
    .site-layer--one .skill-side-inner,
    .site-layer--one .timeline-ribbon-inner,
    .site-layer--one .skills-panel-inner,
    .site-layer--one .details-panel-inner { height: 540px; min-height: 540px; }
    .site-layer--one .skill-side-inner,
    .site-layer--one .timeline-ribbon-inner { padding: 14px 10px; justify-content: center; }
    .site-layer--one .skill-title-img,
    .site-layer--one .timeline-title-img { display: block; max-width: 88%; width: auto; height: 100%; }
    .site-layer--one .skills-panel-inner { padding: 24px 28px; }
    .site-layer--one .skills-content-img { height: 100%; width: 100%; }
    .site-layer--one .details-panel-inner { padding: 22px 34px 24px; gap: 18px; }
    .site-layer--one .timeline-content-wrap { flex: 1 1 auto; }
    .site-layer--one .timeline-content-img { width: 100%; height: auto; }
    .site-layer--one .contact { min-height: 96px; }
    .site-layer--one .contact span { font-size: 18px; }
    @media (max-width: 700px) {
      .site-layer--one { min-height: 0; padding: 22px 0; }
      .site-layer--two { min-height: 80svh; }
      .site-layer--one .portfolio { display: grid; }
    }
  </style>
<style id="two-layer-test-override">html,body{height:auto;min-height:100%;overflow-x:clip;overflow-y:auto}.site{min-height:100svh}.site-layer--two{min-height:0}@media(max-width:700px){.site-layer--one,.site-layer--two{min-height:0}}</style></head>

  <script>
    (function () {
      const layer = document.querySelector('.site-layer--one');
      const frame = document.getElementById('first-frame');
      const design = document.getElementById('first-design');
      const BASE_W = 1440;
      const BASE_H = 820;
      function fitFirstLayer() {
        if (!frame || !design || !layer) return;
        const w = layer.getBoundingClientRect().width || document.documentElement.clientWidth;
        const scale = w / BASE_W;
        frame.style.height = (BASE_H * scale) + 'px';
        design.style.transform = 'scale(' + scale + ')';
      }
      fitFirstLayer();
      if ('ResizeObserver' in window) new ResizeObserver(fitFirstLayer).observe(layer);
      window.addEventListener('resize', fitFirstLayer, { passive: true });
      const networkLayer = document.getElementById('section-two');
      const networkFrame = document.getElementById('network-frame');
      const networkIframe = document.getElementById('network-iframe');
      function fitNetworkLayer() {
        if (!networkLayer || !networkFrame || !networkIframe) return;
        const availableWidth = networkLayer.getBoundingClientRect().width || document.documentElement.clientWidth;
        const scale = availableWidth / 1440;
        networkFrame.style.height = (820 * scale) + 'px';
        networkIframe.style.transform = 'scale(' + scale + ')';
      }
      fitNetworkLayer();
      if ('ResizeObserver' in window) new ResizeObserver(fitNetworkLayer).observe(networkLayer);
      window.addEventListener('resize', fitNetworkLayer, { passive: true });
    })();
  </script>
